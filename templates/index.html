<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chatbot</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
            data-manual
        />
        <link
            href="{{ url_for('static', filename='style.css') }}"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Oswald:wght@200..700&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <header>
            <span class="logo text-center mx-2">PyBot</span>
        </header>
        <div class="container-fluid d-flex">
            <div class="col-1" id="sidebar">
                123123123
            </div>
            <div class="col-11"><div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="card">
                        <div
                            class="card-header d-flex justify-content-between align-items-center"
                        >
                            <h3 class="mb-0">PyBot</h3>
                            <button
                                class="btn btn-outline-danger"
                                id="signout-btn"
                            >
                                Sign Out
                            </button>
                        </div>
                        <div class="card-body">
                            <div id="chat-messages" class="mb-3"></div>
                            <div class="input-group">
                                <input
                                    type="text"
                                    id="user-input"
                                    class="form-control"
                                    placeholder="Type your message..."
                                />
                                <button class="btn btn-primary" id="send-btn">
                                    Send
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div></div>    
            
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
