<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyBot - Python Learning Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
        data-manual />
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet" />
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/2721/2721304.png" type="image/x-icon">
</head>
<script>
    const initialConversationId = "{{ conversation_id if conversation_id else '' }}";
</script>

<body>
    <!-- <header>
        <span class="logo text-center mx-2">PyBot</span>
    </header> -->
    <div class="container-fluid d-flex px-0 vh-100">
        <div class="col-md-3 col-lg-2" id="sidebar">
            {% include "sidebar.html" %}
        </div>
        <div class="col-md-9 col-lg-10">
            <div class="justify-content-center w-100 h-100">
                <div class="card h-100 rounded-0">
                    <div class="card-header d-flex justify-content-between align-items-center rounded-0">
                        <h3 class="mb-0">
                            <i class="fa-solid fa-graduation-cap me-2"></i><span id="conversation-title"></span>
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="chat-messages" class="mb-3">
                            <div id="welcome-msg"
                                class="text-center position-absolute top-50 start-50 translate-middle">
                                <img src="https://cdn-icons-png.flaticon.com/512/2721/2721304.png" alt="PyBot Logo"
                                    width="100" class="mb-4">
                                <h2>Welcome to PyBot</h2>
                                <p class="lead mb-4">Your personal Python tutoring assistant</p>
                                <p class="text-muted">Ask me anything about Python programming!</p>
                                <div class="mt-4">
                                    <p class="small">Example questions:</p>
                                    <div class="d-flex flex-wrap justify-content-center gap-2 mt-2">
                                        <button
                                            class="btn btn-sm btn-outline-secondary rounded-pill example-question">What
                                            is a for loop?</button>
                                        <button
                                            class="btn btn-sm btn-outline-secondary rounded-pill example-question">How
                                            do I create a list?</button>
                                        <button
                                            class="btn btn-sm btn-outline-secondary rounded-pill example-question">Explain
                                            functions in Python</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="input-group" id="user-input-group">
                            <textarea type="text" id="user-input" class="form-control"
                                placeholder="Type your message..." rows="1"></textarea>
                            <button class="btn btn-primary" id="send-btn">
                                <i class="fa-solid fa-paper-plane me-1"></i> Send
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://kit.fontawesome.com/c2bcdb7704.js" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
