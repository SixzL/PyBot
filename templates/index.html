<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
        data-manual />
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet" />
</head>
<script>
    const initialConversationId = "{{ conversation_id if conversation_id else '' }}";
</script>

<body>
    <!-- <header>
        <span class="logo text-center mx-2">PyBot</span>
    </header> -->
    <div class="container-fluid d-flex px-0 ">
        <div class="col-2" id="sidebar">
            {% include "sidebar.html" %}
        </div>
        <div class="col-10">
            <div class="justify-content-center w-100  0">
                <div class="card vh-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">Title</h3>
                    </div>
                    <div class="card-body">
                        <div id="chat-messages" class="mb-3">
                            <div id="welcome-msg"
                                class="text-center h2 align-middle position-absolute top-50 start-50 translate-middle">
                                Hi, I am PyBot. How may I help you today?
                            </div>
                        </div>
                        <div class="input-group" id="user-input-group">
                            <textarea type="text" id="user-input" class="form-control"
                                placeholder="Type your message..." rows="1"></textarea>
                            <button class="btn btn-primary" id="send-btn">
                                Send
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
