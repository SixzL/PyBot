<div class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark h-100">
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
        <span class="fs-4">PyBot</span>
    </a>
    <hr>
    <!-- Regular Conversations Section -->
    <div class="sidebar-section flex-grow-1">
        <div class="category-header">
            <div class="category-title">
                <i class="fa-solid fa-comments me-2"></i>
                <span>Conversations</span>
            </div>
            <button class="btn btn-sm btn-outline-light rounded-circle" title="New conversation">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        <div class="conversation-container overflow-auto mt-3">
            <ul class="nav nav-pills flex-column mb-auto" id="regular-conversations">
                <!-- Regular conversations will be loaded here -->
            </ul>
        </div>
    </div>

    <!-- Focused Learning Section -->
    <div class="sidebar-section flex-grow-1">
        <div class="category-header">
            <div class="category-title">
                <span>Focused Learning</span>
            </div>
        </div>
        <div class="focused-container overflow-auto mt-3">
            <ul class="nav nav-pills flex-column mb-auto" id="focused-conversations">
                <!-- Focused conversations will be loaded here -->
            </ul>
        </div>
    </div>

    <hr>
    <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
            data-bs-toggle="dropdown" aria-expanded="false" onclick="event.stopPropagation();">
            <div class="bg-secondary rounded-circle me-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                <i class="fa-solid fa-user text-white"></i>
            </div>
            <strong>USER</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
            <li><a class="dropdown-item" id="signout-btn" onclick="event.stopPropagation();"><i class="fa-solid fa-right-from-bracket me-2"></i>Sign out</a></li>
        </ul>
    </div>
</div>

<script src="{{ url_for('static', filename='sidebarScript.js') }}"></script>
